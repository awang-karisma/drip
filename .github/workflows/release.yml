name: Release Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release (Android Only)
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            conventional-changelog-conventionalcommits
            @semantic-release/github
            @cleyrop-org/semantic-release-backmerge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build and sign Android APK only if a new release/prerelease was published
      - name: Decode Keystore from Secret
        if: steps.release.outputs.new_release_published == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing! Please configure signing secrets in repository settings."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build Signed Android Release APK
        if: steps.release.outputs.new_release_published == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PDRIP_RELEASE_STORE_FILE=release.keystore \
            -PDRIP_RELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PDRIP_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PDRIP_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            --no-daemon
          cd ..

      - name: Upload Signed APK to GitHub Release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            APK_NAME="drip-${TAG}-android.apk"
            cp "$APK_PATH" "$APK_NAME"
            gh release upload "$TAG" "$APK_NAME" --clobber
            echo "Successfully attached $APK_NAME to GitHub Release $TAG"
          else
            echo "::error::No release APK found in android/app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Cleanup Keystore
        if: always()
        run: rm -f android/app/release.keystore
